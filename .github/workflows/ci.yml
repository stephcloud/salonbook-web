name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy value so the build can run. Not a secret.
      API_URL: https://api.example.invalid/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Blocks on what ships to users only. Dev tools are covered by the next step.
      - run: npm audit --omit=dev --audit-level=high
      # Non-blocking: keeps dev-tool findings visible in the log.
      - run: npm audit
        continue-on-error: true
